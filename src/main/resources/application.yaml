server:
  port: ${SERVER_PORT:9010}

spring:
  application:
    name: ms.contratacion.service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5001}/${DB_NAME:db_upc}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:sistemas123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true
